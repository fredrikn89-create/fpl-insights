name: Oppdater og publiser

on:
  schedule:
    - cron: "17 3 * * *"      # hver natt (UTC)
  workflow_dispatch:           # manuell kjøring fra Actions-fanen
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent ferske data (faller tilbake på forrige data.json hvis det feiler)
        run: |
          if python scripts/fetch_data.py data.new.json; then
            mv data.new.json data.json
          else
            echo "::warning::Kunne ikke hente data fra FPL – bruker forrige data.json"
            rm -f data.new.json
          fi
      - name: Bygg siden
        run: python scripts/build.py
      - name: Lagre oppdatert data.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Oppdater data" && git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
